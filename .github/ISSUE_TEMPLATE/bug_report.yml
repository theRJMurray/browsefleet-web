name: Bug report
description: A broken link, layout issue, or render bug on browsefleet.com.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        For server bugs see the [server repo](https://github.com/theRJMurray/browsefleet/issues). For SDK bugs see [Node](https://github.com/theRJMurray/browsefleet-node/issues) or [Python](https://github.com/theRJMurray/browsefleet-python/issues).

  - type: textarea
    id: where
    attributes:
      label: Page URL
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What is wrong?
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser + version
      placeholder: "Chrome 130 / Firefox 132 / Safari 18"

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/theRJMurray/browsefleet-web/blob/master/CODE_OF_CONDUCT.md).
          required: true
